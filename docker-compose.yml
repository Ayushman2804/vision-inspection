services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inspection
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inspection"]
      interval: 5s
      timeout: 3s
      retries: 10

  inference:
    build: ./inference
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-yolo26n-neu-det-v1}
      # MOCK_MODE=true returns random boxes for UI work; it takes precedence over models/best.onnx
      MOCK_MODE: ${MOCK_MODE:-false}
    ports:
      - "8000:8000"

  gateway:
    build: ./gateway
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/inspection
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      INFERENCE_URL: http://inference:8000
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /data/uploads
      NODE_ENV: development
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_started
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - gateway
    ports:
      - "5173:80"

volumes:
  pgdata18:
  uploads:
